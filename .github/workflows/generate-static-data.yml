name: Generate Static Game Data

on:
  schedule:
    # NFL: Tuesday 10 AM UTC (5 AM EST, after Monday Night Football)
    - cron: '0 10 * 9-12,1-2 2'
    # CFB: Daily during regular season, including Sunday/Monday spillover games
    - cron: '0 8 * 8-11 *'
    # CFB: Daily 10 AM UTC (5 AM EST) during bowl/playoff season (Dec-Jan)
    - cron: '0 10 * 12,1 *'
    # NBA: Daily 10 AM UTC (5 AM EST, after West Coast games)
    - cron: '0 10 * 10-12,1-6 *'
    # MLB: Daily 11 AM UTC (7 AM EDT, after late West Coast/extra-inning games)
    - cron: '0 11 * 3-10 *'
  push:
    paths:
      - '.github/trigger-generate.json'
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport to generate (NFL, CFB, NBA, MLB, or all)'
        required: false
        default: 'all'
      force:
        description: 'Force regenerate existing files'
        required: false
        default: 'false'
      scope:
        description: 'current (the in-progress period) or all (every week or date of the season)'
        required: false
        default: 'current'
      season:
        description: 'Season year for scope=all (default: current)'
        required: false
        default: 'current'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Determine what to generate
        id: determine
        run: |
          DAY_OF_WEEK=$(date +%u)
          MONTH=$(date +%-m)
          echo "Debug: DAY_OF_WEEK=$DAY_OF_WEEK, MONTH=$MONTH, event=${{ github.event_name }}"

          # Manual trigger via workflow_dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected, sport=${{ github.event.inputs.sport }}"
            echo "sport=${{ github.event.inputs.sport }}" >> $GITHUB_OUTPUT
            echo "force=${{ github.event.inputs.force }}" >> $GITHUB_OUTPUT
            echo "scope=${{ github.event.inputs.scope || 'current' }}" >> $GITHUB_OUTPUT
            echo "season=${{ github.event.inputs.season || 'current' }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Push trigger via trigger file
          if [ "${{ github.event_name }}" = "push" ]; then
            TRIGGER_FILE=".github/trigger-generate.json"
            if [ -f "$TRIGGER_FILE" ]; then
              SPORT=$(cat "$TRIGGER_FILE" | jq -r '.sport // "all"')
              FORCE=$(cat "$TRIGGER_FILE" | jq -r '.force // "true"')
              SCOPE=$(cat "$TRIGGER_FILE" | jq -r '.scope // "current"')
              SEASON=$(cat "$TRIGGER_FILE" | jq -r '.season // "current"')
              echo "Push trigger detected, sport=$SPORT, force=$FORCE, scope=$SCOPE, season=$SEASON"
              echo "sport=$SPORT" >> $GITHUB_OUTPUT
              echo "force=$FORCE" >> $GITHUB_OUTPUT
              echo "scope=$SCOPE" >> $GITHUB_OUTPUT
              echo "season=$SEASON" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # Build a list of sports to generate (can be multiple)
          SPORTS=""

          # NFL: Tuesday during season (Sept-Feb), or Sunday/Monday during playoffs (Jan-Feb)
          if [ "$DAY_OF_WEEK" = "2" ] && ([ "$MONTH" -ge 9 ] || [ "$MONTH" -le 2 ]); then
            SPORTS="NFL"
            echo "Added NFL (Tuesday during season)"
          elif ([ "$DAY_OF_WEEK" = "7" ] || [ "$DAY_OF_WEEK" = "1" ]) && ([ "$MONTH" = "1" ] || [ "$MONTH" = "2" ]); then
            SPORTS="NFL"
            echo "Added NFL (playoff weekend)"
          fi

          # CFB: Daily during regular season (Aug-Nov) and bowl/playoff season (Dec-Jan)
          if [ "$MONTH" -ge 8 ] && [ "$MONTH" -le 11 ]; then
            SPORTS="${SPORTS:+$SPORTS,}CFB"
            echo "Added CFB (daily regular season)"
          elif [ "$MONTH" = "12" ] || [ "$MONTH" = "1" ]; then
            SPORTS="${SPORTS:+$SPORTS,}CFB"
            echo "Added CFB (bowl/playoff season)"
          fi

          # NBA: Daily during season (October through June)
          if [ "$MONTH" -ge 10 ] || [ "$MONTH" -le 6 ]; then
            SPORTS="${SPORTS:+$SPORTS,}NBA"
            echo "Added NBA (daily during season)"
          fi

          # MLB: Daily during season (March through October)
          if [ "$MONTH" -ge 3 ] && [ "$MONTH" -le 10 ]; then
            SPORTS="${SPORTS:+$SPORTS,}MLB"
            echo "Added MLB (daily during season)"
          fi

          # Default to none if no sports matched
          if [ -z "$SPORTS" ]; then
            SPORTS="none"
          fi

          echo "Final SPORTS=$SPORTS"
          echo "sport=$SPORTS" >> $GITHUB_OUTPUT
          echo "force=false" >> $GITHUB_OUTPUT
          echo "scope=current" >> $GITHUB_OUTPUT
          echo "season=current" >> $GITHUB_OUTPUT

      - name: Regenerate full season
        if: steps.determine.outputs.scope == 'all'
        run: |
          # Every week (or date) of the season for each requested sport, overwriting existing files.
          for SPORT in NFL CFB NBA MLB; do
            if [ "${{ steps.determine.outputs.sport }}" = "all" ] || echo "${{ steps.determine.outputs.sport }}" | grep -q "$SPORT"; then
              echo "Regenerating all $SPORT data for season ${{ steps.determine.outputs.season }}"
              node scripts/generate-static.js --sport $SPORT --season ${{ steps.determine.outputs.season }} --all --force || echo "$SPORT full regeneration completed with warnings"
            fi
          done

      - name: Generate NFL data
        if: steps.determine.outputs.scope != 'all' && (contains(steps.determine.outputs.sport, 'NFL') || steps.determine.outputs.sport == 'all')
        run: |
          # Season and week resolve from the calendar in shared/season-dates.js.
          # Running Tuesday, "current" is the week whose games ended Monday night.
          echo "Generating NFL current week"
          node scripts/generate-static.js --sport NFL --season current --week current ${{ steps.determine.outputs.force == 'true' && '--force' || '' }} || echo "NFL generation completed with warnings"

          # Generate NFL playoff rounds if in January/February.
          # "current" resolves to the prior calendar year's season before kickoff,
          # so January 2027 maps to the 2026 season.
          MONTH=$(date +%-m)
          DAY=$(date +%-d)

          if [ "$MONTH" = "1" ] && [ "$DAY" -ge 10 ]; then
            echo "Generating NFL playoff rounds"
            # Wild Card (mid-January)
            node scripts/generate-static.js --sport NFL --season current --week wild-card --force || echo "NFL wild-card generation completed with warnings"
            # Divisional (late January)
            if [ "$DAY" -ge 17 ]; then
              node scripts/generate-static.js --sport NFL --season current --week divisional --force || echo "NFL divisional generation completed with warnings"
            fi
            # Conference Championships (late January)
            if [ "$DAY" -ge 24 ]; then
              node scripts/generate-static.js --sport NFL --season current --week conference --force || echo "NFL conference generation completed with warnings"
            fi
          fi
          if [ "$MONTH" = "2" ]; then
            echo "Generating NFL playoff rounds (February)"
            # Generate all playoff rounds in February
            node scripts/generate-static.js --sport NFL --season current --week wild-card --force || echo "NFL wild-card generation completed with warnings"
            node scripts/generate-static.js --sport NFL --season current --week divisional --force || echo "NFL divisional generation completed with warnings"
            node scripts/generate-static.js --sport NFL --season current --week conference --force || echo "NFL conference generation completed with warnings"
            # Super Bowl (early February)
            if [ "$DAY" -ge 9 ]; then
              node scripts/generate-static.js --sport NFL --season current --week super-bowl --force || echo "NFL super-bowl generation completed with warnings"
            fi
          fi

      - name: Generate CFB data
        if: steps.determine.outputs.scope != 'all' && (contains(steps.determine.outputs.sport, 'CFB') || steps.determine.outputs.sport == 'all')
        run: |
          # Season and week resolve from the calendar in shared/season-dates.js.
          # Running Sunday, "current" is the week whose Saturday slate just finished.
          echo "Generating CFB current week"
          node scripts/generate-static.js --sport CFB --season current --week current --force || echo "CFB generation completed with warnings"

          # Tuesday starts a new ESPN week; refresh the previous slate too so
          # late Monday finals are included before it becomes historical.
          PREVIOUS_WEEK=$(node --input-type=module -e "import { getCurrentWeekNumber } from './shared/season-dates.js'; console.log(getCurrentWeekNumber('CFB') - 1)")
          if [ "$PREVIOUS_WEEK" -ge 1 ]; then
            node scripts/generate-static.js --sport CFB --season current --week "$PREVIOUS_WEEK" --force || echo "CFB previous-week generation completed with warnings"
          fi

          # Also generate bowls and playoffs if in December/January
          MONTH=$(date +%-m)
          if [ "$MONTH" = "12" ] || [ "$MONTH" = "1" ]; then
            echo "Generating CFB bowls"
            node scripts/generate-static.js --sport CFB --season current --week bowls --force || echo "CFB bowls generation completed with warnings"
            echo "Generating CFB playoffs"
            node scripts/generate-static.js --sport CFB --season current --week playoffs --force || echo "CFB playoffs generation completed with warnings"
          fi

      - name: Generate NBA data
        if: steps.determine.outputs.scope != 'all' && (contains(steps.determine.outputs.sport, 'NBA') || steps.determine.outputs.sport == 'all')
        run: |
          # Generate yesterday's games only (not future dates)
          YESTERDAY=$(date -d "yesterday" +%Y-%m-%d 2>/dev/null || date -v-1d +%Y-%m-%d)
          echo "Generating NBA data for $YESTERDAY"
          node scripts/generate-static.js --sport NBA --season current --date $YESTERDAY ${{ steps.determine.outputs.force == 'true' && '--force' || '' }} || echo "NBA generation completed with warnings"

      - name: Generate MLB data
        if: steps.determine.outputs.scope != 'all' && (contains(steps.determine.outputs.sport, 'MLB') || steps.determine.outputs.sport == 'all')
        run: |
          # Generate yesterday's games only (not future dates)
          YESTERDAY=$(date -d "yesterday" +%Y-%m-%d 2>/dev/null || date -v-1d +%Y-%m-%d)
          echo "Generating MLB data for $YESTERDAY"
          node scripts/generate-static.js --sport MLB --season current --date $YESTERDAY ${{ steps.determine.outputs.force == 'true' && '--force' || '' }} || echo "MLB generation completed with warnings"

      - name: Check for generated files
        id: check_files
        run: |
          # Add all data files first, then check if there are changes
          git add public/data/
          if git diff --staged --quiet; then
            echo "has_new_files=false" >> $GITHUB_OUTPUT
            echo "No new files generated"
          else
            echo "has_new_files=true" >> $GITHUB_OUTPUT
            echo "New/modified files detected:"
            git diff --staged --name-only
          fi

      - name: Commit and push changes
        if: steps.check_files.outputs.has_new_files == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git commit -m "Auto-generate static game data [skip ci]"

          # Try to push, if it fails (remote has new commits), pull and retry.
          # Always target the branch this run checked out, not main.
          if ! git push; then
            echo "Push failed, pulling latest changes..."
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
          fi
          echo "Successfully committed and pushed new data"
